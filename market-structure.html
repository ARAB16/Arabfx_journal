
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArabFX Smart Chart</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:#fff;font-family:Arial,sans-serif}
header{padding:18px;background:#111a2b}
h2{margin:0;color:#d6b45b}
p{color:#9ba8bd;font-size:12px}
.controls{display:flex;flex-wrap:wrap;gap:8px;padding:14px}
select,button{background:#18243a;color:white;border:1px solid #35445c;padding:10px;border-radius:6px}
button.active{background:#b38b37;color:#101010}
#chart{width:100%;height:430px;display:block;touch-action:pan-y}
.legend{display:flex;flex-wrap:wrap;gap:12px;padding:12px;font-size:12px}
.green{color:#22c58b}.red{color:#ef6262}
.yellow{color:#e8c15b}.blue{color:#60a5fa}
.notice{margin:12px;padding:12px;background:#17243a;border-radius:8px;color:#c6d1e1;font-size:12px}
</style>
</head>
<body>

<header>
<h2>ARABFX SMART CHART</h2>
<p>Market Structure Analysis — Educational Prototype</p>
</header>

<div class="controls">
<select id="pair">
<option>EURUSD</option>
<option>GBPUSD</option>
<option>USDJPY</option>
<option>USDCHF</option>
<option>USDCAD</option>
<option>AUDUSD</option>
<option>NZDUSD</option>
<option>XAUUSD</option>
</select>

<select id="timeframe">
<option>1M</option>
<option>5M</option>
<option selected>15M</option>
<option>30M</option>
<option>1H</option>
<option>4H</option>
</select>

<button id="automatic" class="active">Auto ON</button>
</div>

<div class="controls">
<button data-mark="HH">Mark HH</button>
<button data-mark="HL">Mark HL</button>
<button data-mark="LH">Mark LH</button>
<button data-mark="LL">Mark LL</button>
<button data-mark="BOS">Mark BOS</button>
<button data-mark="CHoCH">Mark CHoCH</button>
<button id="clear">Clear manual marks</button>
</div>

<canvas id="chart"></canvas>

<div class="legend">
<span class="green">● HH / HL</span>
<span class="red">● LH / LL</span>
<span class="blue">● BOS</span>
<span class="yellow">● CHoCH</span>
</div>

<div class="notice" id="status">
Demo chart: simulated prices. Select a marking tool and tap the chart to add your own label.
</div>

<script>
const canvas=document.getElementById("chart");
const ctx=canvas.getContext("2d");
const pair=document.getElementById("pair");
const timeframe=document.getElementById("timeframe");
const status=document.getElementById("status");

let candles=[];
let manual=[];
let selectedMark=null;
let auto=true;

function generateData(){
 let seed=pair.value.length*71+timeframe.value.length*19;
 function random(){
  seed=(seed*9301+49297)%233280;
  return seed/233280;
 }
 let price=pair.value==="XAUUSD"?2700:
 pair.value.includes("JPY")?150:1.08;

 candles=[];
 for(let i=0;i<65;i++){
  let open=price;
  let close=open+(random()-.49)*(price*.009);
  let high=Math.max(open,close)+random()*price*.003;
  let low=Math.min(open,close)-random()*price*.003;
  candles.push({open,close,high,low});
  price=close;
 }
}

function findStructure(){
 let labels=[];
 for(let i=3;i<candles.length-3;i++){
  let c=candles[i];
  let high=true,low=true;

  for(let j=i-3;j<=i+3;j++){
   if(j===i)continue;
   if(candles[j].high>=c.high)high=false;
   if(candles[j].low<=c.low)low=false;
  }

  if(high)labels.push({i,type:"HIGH",price:c.high});
  if(low)labels.push({i,type:"LOW",price:c.low});
 }

 let highs=labels.filter(x=>x.type==="HIGH");
 let lows=labels.filter(x=>x.type==="LOW");

 highs.forEach((x,i)=>{
  if(i===0)return;
  x.label=x.price>highs[i-1].price?"HH":"LH";
 });

 lows.forEach((x,i)=>{
  if(i===0)return;
  x.label=x.price>lows[i-1].price?"HL":"LL";
 });

 return labels.filter(x=>x.label);
}

function draw(){
 const w=canvas.clientWidth;
 const h=430;
 const dpr=window.devicePixelRatio||1;
 canvas.width=w*dpr;
 canvas.height=h*dpr;
 ctx.setTransform(dpr,0,0,dpr,0,0);

 ctx.fillStyle="#080d18";
 ctx.fillRect(0,0,w,h);

 let min=Math.min(...candles.map(c=>c.low));
 let max=Math.max(...candles.map(c=>c.high));
 let pad=(max-min)*.15;
 min-=pad;max+=pad;

 const left=12,right=w-55,top=25,bottom=h-35;
 const x=i=>left+i*(right-left)/candles.length;
 const y=p=>bottom-(p-min)/(max-min)*(bottom-top);

 ctx.strokeStyle="#1d2a40";
 ctx.lineWidth=1;
 for(let i=0;i<6;i++){
  let yy=top+i*(bottom-top)/5;
  ctx.beginPath();ctx.moveTo(left,yy);ctx.lineTo(right,yy);ctx.stroke();
 }

 candles.forEach((c,i)=>{
  let xx=x(i)+2;
  let color=c.close>=c.open?"#20c997":"#ef6262";
  ctx.strokeStyle=color;
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(xx+3,y(c.high));
  ctx.lineTo(xx+3,y(c.low));
  ctx.stroke();

  let bodyTop=y(Math.max(c.open,c.close));
  let bodyHeight=Math.max(2,Math.abs(y(c.open)-y(c.close)));
  ctx.fillRect(xx,bodyTop,6,bodyHeight);
 });

 ctx.font="11px Arial";
 ctx.fillStyle="#aab7ca";
 for(let i=0;i<6;i++){
  let price=max-i*(max-min)/5;
  ctx.fillText(price.toFixed(pair.value==="XAUUSD"?2:4),right+5,top+i*(bottom-top)/5+4);
 }

 if(auto){
  findStructure().forEach(p=>{
   let xx=x(p.i)+4;
   let yy=y(p.price);
   let up=p.label==="HH"||p.label==="HL";
   ctx.fillStyle=up?"#20c997":"#ef6262";
   ctx.font="bold 12px Arial";
   ctx.fillText(p.label,xx-8,yy+(up?-9:17));
  });

  // Simplified close-through-pivot structure break markers
  const pivots=findStructure();
  let bias=0;
  let lastHigh=null,lastLow=null;

  pivots.forEach(p=>{
   if(p.label==="HH"||p.label==="LH")lastHigh=p;
   if(p.label==="HL"||p.label==="LL")lastLow=p;
  });

  candles.forEach((c,i)=>{
   if(lastHigh&&i>lastHigh.i&&c.close>lastHigh.price&&bias!==1){
    let type=bias===-1?"CHoCH":"BOS";
    drawBreak(i,c.high,type);
    bias=1;lastHigh=null;
   }
   if(lastLow&&i>lastLow.i&&c.close<lastLow.price&&bias!==-1){
    let type=bias===1?"CHoCH":"BOS";
    drawBreak(i,c.low,type);
    bias=-1;lastLow=null;
   }
  });
 }

 manual.forEach(m=>drawManual(m));
}

function drawBreak(i,price,type){
 let xx=xPosition(i);
 let yy=yPosition(price);
 ctx.fillStyle=type==="BOS"?"#60a5fa":"#e8c15b";
 ctx.font="bold 11px Arial";
 ctx.fillText(type,xx,yy-8);
}

function xPosition(i){
 return 12+i*(canvas.clientWidth-67)/candles.length+4;
}
function yPosition(price){
 let min=Math.min(...candles.map(c=>c.low));
 let max=Math.max(...candles.map(c=>c.high));
 let pad=(max-min)*.15;
 min-=pad;max+=pad;
 return 395-(price-min)/(max-min)*370;
}

function drawManual(m){
 let xx=xPosition(m.i);
 let yy=yPosition(m.price);
 ctx.fillStyle="#e8c15b";
 ctx.font="bold 13px Arial";
 ctx.fillText(m.type,xx,yy-12);
}

document.querySelectorAll("[data-mark]").forEach(btn=>{
 btn.onclick=()=>{
  selectedMark=btn.dataset.mark;
  document.querySelectorAll("[data-mark]").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  status.textContent="Selected "+selectedMark+". Tap a candle to place the label.";
 };
});

canvas.addEventListener("click",e=>{
 if(!selectedMark)return;
 let rect=canvas.getBoundingClientRect();
 let i=Math.floor((e.clientX-rect.left-12)/(canvas.clientWidth-67)*candles.length);
 i=Math.max(0,Math.min(candles.length-1,i));
 manual.push({i,price:candles[i].close,type:selectedMark});
 draw();
});

document.getElementById("automatic").onclick=()=>{
 auto=!auto;
 document.getElementById("automatic").textContent=auto?"Auto ON":"Auto OFF";
 draw();
};

document.getElementById("clear").onclick=()=>{
 manual=[];
 draw();
};

pair.onchange=()=>{generateData();draw();};
timeframe.onchange=()=>{generateData();draw();};
window.onresize=draw;

generateData();
draw();
</script>
</body>
  </html>
